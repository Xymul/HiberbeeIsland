import java.time.OffsetDateTime

plugins {
  id("java")
  id("org.jetbrains.intellij.platform") version "2.19.0"
  id("io.github.ben-manes.versions") version "0.64.0"
}

group = "com.hiberbee"
version = System.getenv("APP_VERSION") ?: OffsetDateTime.now().format("YYYY.M.d.Hm")

repositories {
  mavenCentral()
  intellijPlatform {
    defaultRepositories()
  }
}

dependencies {
  intellijPlatform {
    // IntelliJ IDEA 2025.3 and newer is shipped as a unified distribution
    intellijIdea("2025.3")
  }
}

java {
  // IntelliJ Platform 2025.3 and newer requires Java 21
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

intellijPlatform {
  buildSearchableOptions = false

  pluginConfiguration {
    version = project.version.toString()

    changeNotes = """
- Adapted to the Islands theme of IntelliJ 2025.3
- Migrated to the IntelliJ Platform Gradle Plugin 2.x
"""

    ideaVersion {
      sinceBuild = "253"
      untilBuild = provider { null }
    }
  }

  publishing {
    token = providers.environmentVariable("JETBRAINS_TOKEN")
      .orElse(providers.environmentVariable("PUBLISH_TOKEN"))
  }
}

tasks {
  wrapper {
    gradleVersion = "9.3.0"
    distributionType = Wrapper.DistributionType.BIN
  }
}
